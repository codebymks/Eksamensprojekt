<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!--Table of all alerts (filled in by admin.js)-->
<h1>All Alerts</h1>
<table id="alerts-table">
    <thead>
    <tr>
        <th>Alert ID</th>
        <th>Epicenter Latitude</th>
        <th>Epicenter Longitude</th>
        <th>Magnitude</th>
        <th>Status</th>
        <th></th>
    </tr>
    </thead>
    <tbody id="alerts-body">
    </tbody>
</table>

<!--Pop-up dialog with the details of one alert (opens when "Details" is clicked)-->
<dialog id="alert-details-dialog">

    <!--Info about the alert-->
    <h2>Alert Details</h2>
    <p>
        <strong>Epicenter:</strong> <span id="detail-epicenter"></span><br>
        <strong>Magnitude:</strong> <span id="detail-magnitude"></span><br>
        <strong>Status:</strong> <span id="detail-status"></span>
    </p>

    <!--The sensor readings-->
    <h3>Sensor Readings</h3>
    <table id="readings-table">
        <thead>
        <tr>
            <th>Reading ID</th>
            <th>Sensor ID</th>
            <th>Sensor Latitude</th>
            <th>Sensor Longitude</th>
            <th>Distance to Epicenter (km)</th>
            <th>Magnitude</th>
            <th>Recorded At</th>
        </tr>
        </thead>
        <tbody id="readings-body"></tbody>
    </table>

    <!--Buttons to change the alert's status-->
    <h3>Actions</h3>
    <div id="detail-actions"></div>

    <!--Citizen reports submitted for this alert-->
    <h3>Reports</h3>
    <p id="detail-reports"></p>

    <!--Close the pop-up-->
    <form method="dialog">
        <button>Close</button>
    </form>
</dialog>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
