<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/citizenReport.css">
</head>
<body>

<!--Table of active alerts (filled in by user.js)-->
<h1>Active Alerts</h1>

<table id="alerts-table">
    <thead>
    <tr>
        <th>Alert ID</th>
        <th>Epicenter Latitude</th>
        <th>Epicenter Longitude</th>
        <th>Magnitude</th>
        <th>Area</th>
        <th>Report it (Use Richter Scale)</th>
    </tr>
    </thead>
    <tbody id="alerts-body">
    </tbody>
</table>

<!--Message shown when there are no active alerts-->
<p id="no-alerts-message"></p>

<script src="../js/api.js"></script>
<script src="../js/user.js"></script>
</body>
</html>
